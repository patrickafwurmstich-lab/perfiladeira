<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parecis Telha 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Full-screen idle-game view: 3D yard fills the screen, a chunky HUD floats on top. Single bright theme (it's a game scene). */
:root{
  --ink:#1d2433; --pill:#ffffff; --gold:#ffb000; --green:#22b45a; --shadow:0 4px 0 rgba(0,0,0,.18);
  --f:"Baloo 2","Trebuchet MS",system-ui,sans-serif; color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:#8fd16b;overflow:hidden;font-family:var(--f);color:var(--ink);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));
  display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.pill{pointer-events:auto;background:var(--pill);border-radius:999px;padding:4px 14px 4px 6px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);
  font-weight:800;font-size:20px;line-height:1}
.pill i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;font-style:normal;font-size:16px;font-weight:800}
.pill.green i{background:var(--green)}
.pill small{font-size:12px;font-weight:700;color:#6b7385;display:block;margin-top:-2px}
.sp{flex:1}
.btn{pointer-events:auto;border:0;background:#fff;color:var(--ink);font:800 16px var(--f);min-width:44px;height:44px;border-radius:14px;box-shadow:var(--shadow);cursor:pointer;padding:0 10px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:focus-visible{outline:3px solid var(--gold)}
.hint{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(29,36,51,.78);color:#fff;
  font:600 13px var(--f);padding:6px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .6s}
.pop{position:fixed;pointer-events:none;font:800 22px var(--f);color:#fff;text-shadow:0 2px 0 #1c7a3c,0 0 6px rgba(0,0,0,.35);transform:translate(-50%,-50%);white-space:nowrap}
.status{position:fixed;left:max(16px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 54px);pointer-events:none;
  background:rgba(255,255,255,.9);border-radius:12px;padding:6px 10px;font:700 13px var(--f);box-shadow:var(--shadow);line-height:1.35}
.status b{font-weight:800}
.err{position:fixed;inset:auto 16px 60px 16px;background:#fff;border-radius:12px;padding:12px;font:600 14px var(--f);box-shadow:var(--shadow)}
@media (max-width:520px){ .pill{font-size:17px} .status{font-size:12px} }
</style>
</head>
<body>


<canvas id="c" aria-label="Fábrica de telhas vista de cima"></canvas>
<div class="hud">
  <div class="pill"><i>R$</i><span id="money">0</span></div>
  <div class="pill green"><i>▦</i><span><span id="sheets">0</span><small>telhas feitas</small></span></div>
  <div class="sp"></div>
  <button class="btn" id="btnSpeed" title="Velocidade do tempo">1×</button>
  <button class="btn" id="btnHome" title="Centralizar a câmera">⌖</button>
</div>
<div class="status" id="status" aria-live="polite"></div>
<div class="hint" id="hint">Arraste para andar · pinça ou roda do mouse para zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const fmtMoney = n => Math.round(n).toLocaleString('pt-BR');
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

// ---------------- renderer / camera ----------------
const canvas = $('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias:true}); }
catch(e){ const d = document.createElement('div'); d.className = 'err'; d.textContent = 'Seu navegador não conseguiu iniciar o 3D (WebGL).'; document.body.appendChild(d); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd8ff);
scene.fog = new THREE.Fog(0x9fd8ff, 60, 160);
const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 1200);
const CAM_OFF = new V3(14, 32, 23), CAM_HOME = new V3(20, 0, -16);
camera.position.copy(CAM_HOME).add(CAM_OFF);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.copy(CAM_HOME); controls.enableRotate = false; controls.screenSpacePanning = false; controls.enableDamping = true;
controls.minDistance = 14; controls.maxDistance = 240;
controls.mouseButtons = {LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN};
controls.touches = {ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN};
controls.addEventListener('change', () => {   // keep the view over the yard
  const t = controls.target, cx = Math.max(-40, Math.min(460, t.x)), cz = Math.max(-56, Math.min(30, t.z));
  if (cx !== t.x || cz !== t.z) { camera.position.x += cx - t.x; camera.position.z += cz - t.z; t.x = cx; t.z = cz; }
  $('hint').style.opacity = 0;
});
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x7fae6a, 0.75));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.95);
sun.position.set(18, 40, 22); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-38, right:38, top:30, bottom:-30, near:5, far:110});
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
sun.target.position.set(0, 0, 0); scene.add(sun, sun.target);

// ---------------- helpers ----------------
const mat = (color, metal=0.05, rough=0.7, extra={}) => new THREE.MeshStandardMaterial(Object.assign({color, metalness:metal, roughness:rough}, extra));
let ROOT = scene;
function add(mesh, x, y, z, parent){ mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true; (parent || ROOT).add(mesh); return mesh; }
const box = (w,h,d,m,x,y,z,p) => add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m), x,y,z,p);
function cylZ(r,len,m,x,y,z,seg=20,p){ const g = new THREE.CylinderGeometry(r,r,len,seg); g.rotateX(Math.PI/2); return add(new THREE.Mesh(g,m), x,y,z,p); }
function cylY(r,len,m,x,y,z,seg=20,p){ return add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg), m), x,y,z,p); }
function labelTex(lines, w=512, h=256, bg='#1d2433', fg='#ffffff', size=64){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((t, i) => { g.font = (i ? '700 ' + Math.round(size*0.62) : '800 ' + size) + 'px "Baloo 2", sans-serif'; g.fillText(t, w/2, h/2 + (i - (lines.length-1)/2) * size * 0.95); });
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}

const M = {
  grass: mat(0x86c95e, 0, 1), concrete: mat(0xd9dbdf, 0, 0.95), asphalt: mat(0x50555e, 0, 0.95), epoxy: mat(0xb7c3c9, 0, 0.85),
  line: mat(0xffc400, 0, 0.8), white: mat(0xffffff, 0, 0.8), blue: mat(0x2463e6, 0.15, 0.5), yellow: mat(0xffbe0b, 0.1, 0.5),
  steel: mat(0xb8c0ca, 0.7, 0.35), sheet: mat(0xbfc7d1, 0.45, 0.38, {side:THREE.DoubleSide}), dark: mat(0x22252b, 0.3, 0.6),
  gray: mat(0xc3c7cd, 0.05, 0.6), core: mat(0x3a3e45, 0.5, 0.5), wood: mat(0xb88a52, 0, 0.9), red: mat(0xe53935, 0, 0.5),
  green: mat(0x22b45a, 0, 0.5), glass: mat(0x2c3e50, 0.3, 0.2), trunk: mat(0x8a5a32, 0, 0.9), leaf: mat(0x4caf50, 0, 0.9),
  leaf2: mat(0x3d9b46, 0, 0.9), roofBeam: mat(0x1f4fb8, 0.2, 0.5), orange: mat(0xff7a1a, 0.1, 0.5), rubber: mat(0x1b1d22, 0, 0.9),
  wall: mat(0xf2efe8, 0, 0.9)
};

// ================= SITE: 3 barracões em fila, corredor do caminhão e faixa da empilhadeira atravessando todos =================
const SHED_L = 132, SHED_D = 40, SHED_GAP = 12;
const shedX0 = k => k * (SHED_L + SHED_GAP);
const X0 = shedX0(0);
const Z_BACK = -40, Z_FRONT = 0, CORR_Z = -5, LANE_Z = -11, FAIXA_Z = -13;
const SITE_X1 = shedX0(2) + SHED_L;                 // 420
const ROAD_Z = 22, GATE_IN_X = -10, GATE_OUT_X = SITE_X1 + 10, FENCE_Z = 13;
const YARD_X0 = -24, YARD_X1 = SITE_X1 + 24, YARD_Z0 = -52;
const EAVE = 10, RIDGE = 12.5, RUNWAY_Y = 7.4;

function stripeTex(w, h, base, line, step, extra){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += step) { g.fillStyle = line; g.fillRect(x, 0, Math.max(2, step*0.28), h); g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x + step*0.5, 0, 2, h); }
  if (extra) extra(g, w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function floorLine(x0, z0, x1, z1, m=M.line, w=0.16){ const L = Math.hypot(x1-x0, z1-z0); const b = box(L, 0.02, w, m, (x0+x1)/2, 0.115, (z0+z1)/2); b.rotation.y = -Math.atan2(z1-z0, x1-x0); b.castShadow = false; return b; }
function floorLabel(lines, x, z, w, h, bg='#ffffff', fg='#1d2433', size=84, opacity=1){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({map: labelTex(lines, Math.round(256*w/h), 256, bg, fg, size), transparent: opacity < 1, opacity}));
  m.rotation.x = -Math.PI/2; m.position.set(x, 0.13, z); scene.add(m); return m;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function tree(x, z, s=1){
  cylY(0.18*s, 1.2*s, M.trunk, x, 0.6*s, z, 8);
  const m = add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.1*s, 0), rnd() > 0.5 ? M.leaf : M.leaf2), x, 1.9*s, z); m.rotation.set(rnd(), rnd(), rnd());
}

// ---------------- ground, road, yard ----------------
const grass = new THREE.Mesh(new THREE.PlaneGeometry(1600, 700), M.grass); grass.rotation.x = -Math.PI/2; grass.position.set(SITE_X1/2, 0, 0); grass.receiveShadow = true; scene.add(grass);
box(YARD_X1 - YARD_X0, 0.06, FENCE_Z - YARD_Z0, M.concrete, (YARD_X0 + YARD_X1)/2, 0.03, (FENCE_Z + YARD_Z0)/2).castShadow = false;
box(1600, 0.04, 8, M.asphalt, SITE_X1/2, 0.02, ROAD_Z).castShadow = false;
for (let x = -560; x < 980; x += 8) box(3.4, 0.02, 0.2, M.white, x, 0.05, ROAD_Z).castShadow = false;
box(1600, 0.1, 1.8, M.concrete, SITE_X1/2, 0.05, ROAD_Z - 5).castShadow = false;
for (const gx of [GATE_IN_X, GATE_OUT_X]) box(12, 0.03, 30, M.asphalt, gx, 0.09, (CORR_Z + 4 + ROAD_Z)/2 - 2).castShadow = false;   // driveways
// corridor (truck) + lane (forklift) run through all three sheds
const CORR_X0 = GATE_IN_X - 6, CORR_X1 = GATE_OUT_X + 6;
box(CORR_X1 - CORR_X0, 0.03, 8, M.asphalt, (CORR_X0 + CORR_X1)/2, 0.1, CORR_Z).castShadow = false;
floorLine(CORR_X0, CORR_Z - 4, CORR_X1, CORR_Z - 4, M.white); floorLine(CORR_X0, CORR_Z + 4, CORR_X1, CORR_Z + 4, M.white);
for (let x = CORR_X0 + 2; x < CORR_X1; x += 6) floorLine(x, CORR_Z, x + 3, CORR_Z, M.line, 0.14);
box(SITE_X1, 0.025, 4, mat(0x9aa9b4, 0, 0.85), SITE_X1/2, 0.105, LANE_Z).castShadow = false;
floorLine(0, FAIXA_Z, SITE_X1, FAIXA_Z, M.line, 0.22);
for (let x = 2; x < SITE_X1; x += 10) { const a = floorLine(x, LANE_Z, x + 1.6, LANE_Z, M.white, 0.5); }

// ---------------- barracão ----------------
const ROOF = new THREE.Group(); scene.add(ROOF);   // some quando você aproxima o zoom, para ver as máquinas
const roofMats = [];
const fadeMat = m => { m.transparent = true; roofMats.push(m); return m; };
const steelBlue = M.blue, runwayM = mat(0x5b6370, 0.5, 0.5);
const clad = mat(0xffffff, 0.25, 0.6, {map: stripeTex(512, 256, '#d5dae0', '#b7bec7', 24)}); clad.map.repeat.set(SHED_L/6, 1);
const cladEnd = mat(0xffffff, 0.25, 0.6, {map: stripeTex(512, 256, '#d5dae0', '#b7bec7', 24)}); cladEnd.map.repeat.set(27/6, 1);
const cladHead = mat(0xffffff, 0.25, 0.6, {map: stripeTex(512, 256, '#d5dae0', '#b7bec7', 24)}); cladHead.map.repeat.set(13/6, 0.4);
const roofTex = stripeTex(1024, 512, '#c7ccd2', '#aab1ba', 16, (g, w, h) => {
  for (let i = 0; i < 2; i++) { const x = 80 + i * w/2; g.fillStyle = '#eef6fc'; g.fillRect(x, h*0.3, w/2 - 160, h*0.34); g.strokeStyle = '#9aa3ad'; g.lineWidth = 8; g.strokeRect(x, h*0.3, w/2 - 160, h*0.34); }
});
roofTex.repeat.set(SHED_L/12, 1);
const roofMat = fadeMat(mat(0xffffff, 0.35, 0.5, {map: roofTex})), purlinM = fadeMat(mat(0x8e98a4, 0.4, 0.5));
const frameM = fadeMat(mat(0x2463e6, 0.15, 0.5)), trimM = fadeMat(mat(0x1f4fb8, 0.2, 0.5)), capM = fadeMat(mat(0x9aa3ad, 0.4, 0.5)), triM = fadeMat(mat(0xd5dae0, 0.25, 0.6));

function buildShed(x0){
  const xc = x0 + SHED_L/2, zc = (Z_BACK + Z_FRONT)/2, half = SHED_D/2, a = Math.atan2(RIDGE - EAVE, half), rl = half / Math.cos(a);
  box(SHED_L, 0.04, SHED_D, M.epoxy, xc, 0.08, zc).castShadow = false;
  for (let x = x0; x <= x0 + SHED_L + 0.01; x += 12) {
    for (const z of [Z_BACK, Z_FRONT]) {
      box(0.7, EAVE, 0.7, steelBlue, x, EAVE/2, z); box(1.3, 0.1, 1.3, steelBlue, x, 0.13, z);
      box(0.5, 0.5, 1.1, steelBlue, x, RUNWAY_Y - 0.6, z + (z < 0 ? 0.75 : -0.75));    // console da viga de rolamento
    }
    box(0.45, 0.6, rl, frameM, x, (EAVE + RIDGE)/2, zc + half/2, ROOF).rotation.x = a;
    box(0.45, 0.6, rl, frameM, x, (EAVE + RIDGE)/2, zc - half/2, ROOF).rotation.x = -a;
  }
  for (const z of [Z_BACK, Z_FRONT]) box(SHED_L + 0.7, 0.6, 0.5, frameM, xc, EAVE - 0.2, z, ROOF);
  box(SHED_L + 0.7, 0.45, 0.45, frameM, xc, RIDGE - 0.1, zc, ROOF);
  // vigas de rolamento da ponte (as duas laterais, ponta a ponta)
  for (const z of [Z_BACK + 1.0, Z_FRONT - 1.0]) { box(SHED_L, 0.7, 0.5, runwayM, xc, RUNWAY_Y, z); box(SHED_L, 0.1, 0.16, M.dark, xc, RUNWAY_Y + 0.4, z); }
  // parede do fundo + paredes das pontas (com a abertura do corredor e da faixa)
  box(SHED_L, EAVE - 1, 0.2, clad, xc, 1 + (EAVE - 1)/2, Z_BACK - 0.45); box(SHED_L, 1, 0.3, steelBlue, xc, 0.5, Z_BACK - 0.45);
  for (const x of [x0, x0 + SHED_L]) {
    const dx = x === x0 ? -0.45 : 0.45;
    box(0.2, EAVE - 1, 27, cladEnd, x + dx, 1 + (EAVE - 1)/2, (Z_BACK + FAIXA_Z)/2); box(0.3, 1, 27, steelBlue, x + dx, 0.5, (Z_BACK + FAIXA_Z)/2);
    box(0.2, EAVE - 6.5, 13, cladHead, x + dx, 6.5 + (EAVE - 6.5)/2, (FAIXA_Z + Z_FRONT)/2);
    box(0.5, 0.4, 13.4, M.yellow, x + dx, 6.3, (FAIXA_Z + Z_FRONT)/2);
  }
  // telhado
  const ov = 0.8, run = half + ov, L = run / Math.cos(a), W = SHED_L + 1.4, lift = 0.4;
  for (const sgn of [1, -1]) {
    const r = add(new THREE.Mesh(new THREE.BoxGeometry(W, L, 0.12), roofMat), xc, (RIDGE + EAVE - ov*Math.tan(a))/2 + lift, zc + sgn*run/2, ROOF);
    r.rotation.x = sgn > 0 ? -Math.PI/2 + a : -Math.PI/2 - a;
    for (let k = 1; k <= 5; k++) { const f = k / 6; box(SHED_L, 0.2, 0.2, purlinM, xc, RIDGE - (RIDGE - EAVE)*f + 0.2, zc + sgn*half*f, ROOF); }
  }
  const yE = EAVE - ov*Math.tan(a) + lift;
  for (const sgn of [1, -1]) box(W, 0.35, 0.2, trimM, xc, yE, zc + sgn*run, ROOF);
  box(W, 0.18, 0.9, capM, xc, RIDGE + lift + 0.06, zc, ROOF);
  for (const x of [x0 - 0.7, x0 + SHED_L + 0.7]) for (const sgn of [1, -1]) {
    const b = box(0.2, 0.35, L, trimM, x, (RIDGE + yE - lift)/2 + lift, zc + sgn*run/2, ROOF); b.rotation.x = sgn > 0 ? a : -a;
  }
  const tri = new THREE.Shape(); tri.moveTo(Z_BACK, EAVE); tri.lineTo(Z_FRONT, EAVE); tri.lineTo(zc, RIDGE); tri.closePath();
  const tg = new THREE.ExtrudeGeometry(tri, {depth:0.15, bevelEnabled:false}); tg.rotateY(-Math.PI/2);
  for (const x of [x0 - 0.3, x0 + SHED_L + 0.45]) add(new THREE.Mesh(tg, triM), x, 0, 0, ROOF);
}
function lockedShed(k, price){
  const x0 = shedX0(k), xc = x0 + SHED_L/2, zc = (Z_BACK + FAIXA_Z)/2;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(SHED_L, SHED_D), new THREE.MeshBasicMaterial({color:0x1d2433, transparent:true, opacity:0.08}));
  m.rotation.x = -Math.PI/2; m.position.set(xc, 0.09, (Z_BACK + Z_FRONT)/2); scene.add(m);
  const seg = 2;
  for (let x = x0; x < x0 + SHED_L - 0.1; x += seg*2) box(seg, 0.02, 0.2, M.white, x + seg/2, 0.12, Z_BACK).castShadow = false;
  for (let z = Z_BACK; z < FAIXA_Z - 0.1; z += seg*2) for (const x of [x0, x0 + SHED_L]) box(0.2, 0.02, seg, M.white, x, 0.12, z + seg/2).castShadow = false;
  for (let x = x0; x <= x0 + SHED_L + 0.01; x += 12) for (const z of [Z_BACK, Z_FRONT]) box(1.3, 0.25, 1.3, M.gray, x, 0.13, z);   // sapatas prontas
  floorLabel(['🔒 BARRACÃO ' + (k + 1), 'R$ ' + price], xc, zc, 34, 13, '#ffffff', '#1d2433', 96, 0.92);
}
buildShed(X0);
lockedShed(1, '400.000');
lockedShed(2, '900.000');

// vagas do barracão 1: 12 vagas de 8 m (estoque 0–18, vagas 18–114, expedição 114–132)
const VAGA_X0 = X0 + 18, VAGA_W = 8, N_VAGAS = 12;
const vagaCX = i => VAGA_X0 + VAGA_W*i + VAGA_W/2;
for (let i = 0; i <= N_VAGAS; i++) floorLine(VAGA_X0 + VAGA_W*i, Z_BACK + 1.6, VAGA_X0 + VAGA_W*i, FAIXA_Z - 0.8);
floorLine(VAGA_X0, Z_BACK + 1.6, VAGA_X0 + VAGA_W*N_VAGAS, Z_BACK + 1.6);
for (let i = 0; i < N_VAGAS; i++) floorLabel(i === 0 ? ['VAGA 1'] : ['VAGA ' + (i + 1), 'livre'], vagaCX(i), FAIXA_Z - 2.2, 6.4, 2.3, i === 0 ? '#22b45a' : '#ffffff', i === 0 ? '#ffffff' : '#1d2433', 92, i === 0 ? 1 : 0.9);
floorLabel(['ESTOQUE'], X0 + 9, FAIXA_Z - 2.2, 12, 2.3, '#ffbe0b', '#1d2433', 110);

  get pos(){ return this.o.position; }
  place(x, z, h){ this.o.position.set(x, 0, z); this.h = h; this.o.rotation.y = h; }
  go(pts, cb){ this.path = pts.map(p => ({x:p[0], z:p[1], rev:!!p[2]})); this.cb = cb || null; }

  uiT += real; if (uiT > 0.15) { uiT = 0; updateUI(); }
  controls.update(); followView(); renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
updateUI(); requestAnimationFrame(loop);
window.__jogo = {S, camera, controls, CT, ST, FA, FB, crane, LINE};
})();
